# The whole environment with one command:   docker compose up --build
# Settings come from .env next to this file (copy .env.example to .env first).
name: mybeta

x-backend-env: &backend-env
  DB_HOST: db
  DB_USER: mybeta
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_NAME: hw_2
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  BRAIN_MODE: ${BRAIN_MODE:-}
  APP_URL: http://localhost:${WEB_PORT:-8080}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hw_2
      MYSQL_USER: mybeta
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      # MySQL runs this only when the data volume is empty, i.e. on the very first start.
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP (127.0.0.1), not the socket: during first-time setup MySQL runs a temporary server
      # without networking, so this only succeeds once the real server is up.
      # $$ keeps compose from substituting; the container's shell expands the variable.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    image: mybeta-backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./backend
    image: mybeta-backend
    command: ["python", "-m", "bots.worker"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
