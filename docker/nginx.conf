# Serves the built React app and forwards API calls to the backend container.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        # Paths like /users are React Router pages, not files.
        try_files $uri /index.html;
    }

    # Uploaded images, read straight from the volume the backend writes to.
    location /uploads/ {
        alias /srv/uploads/;
        # Names are random and never reused, so browsers can keep a file as long as they like.
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Serve only as the type the extension says; never let a browser guess another one.
        add_header X-Content-Type-Options nosniff;
    }

    location /api/ {
        # nginx refuses bodies over 1 MB by default; uploads may be up to 5 MB (plus form overhead).
        client_max_body_size 6m;
        # "backend" is the compose service name; Docker's internal DNS resolves it.
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
