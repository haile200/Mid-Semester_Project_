# Serves the built React app and forwards API calls to the backend container.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        # Paths like /users are React Router pages, not files.
        try_files $uri /index.html;
    }

    location /api/ {
        # "backend" is the compose service name; Docker's internal DNS resolves it.
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
