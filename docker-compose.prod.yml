# Production on EC2:   docker compose -f docker-compose.prod.yml up -d
# The database is RDS, so there is no db service. Settings come from backend/.env on the server
# (DB_HOST points at RDS; GEMINI_API_KEY for the brain; APP_URL, SMTP_USER and SMTP_PASSWORD for
# password reset emails).
# Images are built on a developer machine and loaded onto the server, which has too little memory
# to build them; pull_policy: never stops compose from fetching a same-named image from Docker Hub.
name: mybeta

services:
  backend:
    image: mybeta-backend
    pull_policy: never
    env_file: backend/.env
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    image: mybeta-backend
    pull_policy: never
    command: ["python", "-m", "bots.worker"]
    env_file: backend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: mybeta-frontend
    pull_policy: never
    ports:
      - "80:80"
    volumes:
      # Read-only: nginx only serves the images.
      - uploads:/srv/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Uploaded images outlive container rebuilds and deploys. They live on the EC2 disk.
  uploads:
